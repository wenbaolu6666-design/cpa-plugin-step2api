name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.4)"
        required: true
        default: "v1.0.4"

permissions:
  contents: write

env:
  PLUGIN_ID: step2api

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: darwin
            goarch: arm64
            os: macos-latest
            ext: .dylib
          - goos: darwin
            goarch: amd64
            os: macos-latest
            ext: .dylib
          - goos: linux
            goarch: amd64
            os: ubuntu-24.04
            ext: .so
          - goos: linux
            goarch: arm64
            os: ubuntu-24.04
            ext: .so
          - goos: windows
            goarch: amd64
            os: ubuntu-24.04
            ext: .dll

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Install Toolchains on Linux
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-mingw-w64-x86-64 zip

      - name: Determine Version
        id: ver
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag || github.ref_name }}"
          VERSION="${RAW_TAG#v}"
          echo "tag=${RAW_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Test Native Targets
        if: (matrix.goos == 'darwin' && matrix.goarch == 'arm64') || (matrix.goos == 'linux' && matrix.goarch == 'amd64')
        run: go test -v ./...

      - name: Build Dynamic Library & Package Zip
        shell: bash
        run: |
          mkdir -p out
          LIB_NAME="${PLUGIN_ID}${{ matrix.ext }}"
          ZIP_NAME="${PLUGIN_ID}_${{ steps.ver.outputs.version }}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"
          export CGO_ENABLED=1
          export GOOS=${{ matrix.goos }}
          export GOARCH=${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "darwin" ]; then
            export MACOSX_DEPLOYMENT_TARGET="13.0"
            export CGO_CFLAGS="-O2 -mmacosx-version-min=13.0 -arch ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}"
            export CGO_LDFLAGS="-mmacosx-version-min=13.0 -arch ${{ matrix.goarch == 'amd64' && 'x86_64' || 'arm64' }}"
          elif [ "${{ matrix.goos }}" = "linux" ] && [ "${{ matrix.goarch }}" = "arm64" ]; then
            export CC="aarch64-linux-gnu-gcc"
          elif [ "${{ matrix.goos }}" = "windows" ]; then
            export CC="x86_64-w64-mingw32-gcc"
          fi
          go build -buildmode=c-shared -trimpath -ldflags="-s -w" -o "out/${LIB_NAME}" ./cmd/step2api-plugin
          (cd out && zip -j "../${ZIP_NAME}" "${LIB_NAME}")

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: plugin-${{ matrix.goos }}-${{ matrix.goarch }}
          path: "${{ env.PLUGIN_ID }}_*_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate checksums.txt & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd artifacts
          sha256sum *.zip > checksums.txt
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          gh release upload "$TAG" *.zip checksums.txt --clobber -R "${{ github.repository }}" || \
          gh release create "$TAG" *.zip checksums.txt --title "$TAG - Step2API Plugin Release" --notes "StepFun AI Studio native CPA plugin release." -R "${{ github.repository }}"
